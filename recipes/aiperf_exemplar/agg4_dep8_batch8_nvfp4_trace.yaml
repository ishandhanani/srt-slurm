name: agg4_dep8_batch8_nvfp4_trace  # 4 agg workers, round robin

model:
  path: "deepseek-v32-nvfp4"
  # container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.0"
  container: "dyn-090-with-adp-trtllm"  # but doesn't use router
  precision: "fp4"

resources:
  gpu_type: "gb200"
  agg_nodes: 8            
  agg_workers: 4
  gpus_per_agg: 8

  gpus_per_node: 4

backend:
  type: trtllm

  aggregated_environment: # inherit from `decode_environment`  
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    TRTLLM_ENABLE_PDL: "1"
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_FORCE_COMM_METHOD: "NVLINK_TWO_SIDED"
    ENABLE_CONFIGURABLE_MOE: "1"
    TLLM_OVERRIDE_LAYER_NUM: "61"

  trtllm_config:
    aggregated:
      allreduce_strategy: MNNVL
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 120000 # must be greater than max isl
      max_num_tokens: 8192
      enable_chunked_prefill: true
      disable_overlap_scheduler: true
      cuda_graph_config:
        max_batch_size: 8                
        enable_padding: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9 
        tokens_per_block: 64
      max_batch_size: 8                  
      max_seq_len: 121000                   # 8k osl
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      # nvfp4_gemm_config:
      #   allowed_backends:
      #   - cutlass
      #   - cublaslt
      #   - cutedsl
      #   - cuda_core
      moe_expert_parallel_size: 8          # EP8
      num_postprocess_workers: 8           # increased from 4
      print_iter_log: true
      stream_interval: 10                  # reduced from 100
      tensor_parallel_size: 8              # TP8 (gets ignored with dep=true)


benchmark:
  type: "trace-replay"                     
  # trace_file: "traces/conversation_trace_synth_15x1+10.0_speedup1_maxseqlen120000.jsonl"
  trace_file: "traces/conversation_trace_synth_16.00x1+10.00_speedup1_maxisl110000.jsonl"
  ttft_threshold_ms: 20000  # 20 seconds
  itl_threshold_ms: 50

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "round-robin"
    router-reset-states: true

health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false
