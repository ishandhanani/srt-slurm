name: base_ctx1_dep8_gen1_dep8_batch32_8_nvfp4  # 2 prefill, 2 decode workers

model:
  path: "deepseek-v32-nvfp4"
  # container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.0"
  container: "dyn-090-with-adp-trtllm"
  precision: "fp4"

resources:
  gpu_type: "gb200"
  prefill_nodes: 2           
  prefill_workers: 1
  gpus_per_prefill: 8

  decode_nodes: 2
  decode_workers: 1
  gpus_per_decode: 8

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    TRTLLM_ENABLE_PDL: "1"
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_OVERRIDE_LAYER_NUM: "61"

  decode_environment:
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    TRTLLM_ENABLE_PDL: "1"
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_FORCE_COMM_METHOD: "NVLINK_TWO_SIDED"
    ENABLE_CONFIGURABLE_MOE: "1"
    TLLM_OVERRIDE_LAYER_NUM: "61"

  trtllm_config:
    prefill:
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 40000 # must be greater than max isl
      max_num_tokens: 8192  
      enable_chunked_prefill: true
      cuda_graph_config: 
        max_batch_size: 32
        enable_padding: true
      disable_overlap_scheduler: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        tokens_per_block: 64
      max_batch_size: 32                   # max bs 
      max_seq_len: 48000                   # max seq len 48k 
      moe_config:
        backend: TRTLLM
      # nvfp4_gemm_config:
      #   allowed_backends:
      #   - cutlass
      #   - cublaslt
      #   - cutedsl
      #   - cuda_core
      moe_expert_parallel_size: 8          # EP8
      print_iter_log: true
      tensor_parallel_size: 8              # TP8 (gets ignored with dep=true)

    decode:
      allreduce_strategy: MNNVL
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 40000 # must be greater than max isl
      max_num_tokens: 8192
      cuda_graph_config:
        max_batch_size: 8                
        enable_padding: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9 
        tokens_per_block: 64
      max_batch_size: 8                  
      max_seq_len: 48000                   # 8k osl
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      # nvfp4_gemm_config:
      #   allowed_backends:
      #   - cutlass
      #   - cublaslt
      #   - cutedsl
      #   - cuda_core
      moe_expert_parallel_size: 8          # EP8
      num_postprocess_workers: 8           # increased from 4
      print_iter_log: true
      stream_interval: 10                  # reduced from 100
      tensor_parallel_size: 8              # TP8 (gets ignored with dep=true)


benchmark:
  type: "aiperf"                     
  isl: 36000 
  osl: 8000
  concurrencies: ['4','16','32','64','128','256']
  req_rate: 100

frontend:
  type: "dynamo"
  enable_multiple_frontends: false


health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false
