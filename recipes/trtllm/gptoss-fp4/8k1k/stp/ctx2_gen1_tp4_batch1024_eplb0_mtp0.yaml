name: "ctx2_gen1_tp4_batch1024_eplb0_mtp0"

model:
  path: "gptoss"
  container: "dynamo-trtllm"
  precision: "fp4"

resources:
  gpu_type: "gb200"
  prefill_nodes: 2
  prefill_workers: 2
  gpus_per_prefill: 1

  decode_workers: 1
  decode_nodes: 1

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    NCCL_GRAPH_REGISTER: "0"
    TRTLLM_ENABLE_PDL: "1"
    OVERRIDE_QUANT_ALGO: "W4A8_MXFP4_MXFP8"
    OMPI_MCA_coll_ucc_enable: "0"

  decode_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    NCCL_GRAPH_REGISTER: "0"
    TRTLLM_ENABLE_PDL: "1"
    OVERRIDE_QUANT_ALGO: "W4A8_MXFP4_MXFP8"
    OMPI_MCA_coll_ucc_enable: "0"

  trtllm_config:
    prefill:
      max_batch_size: 32
      max_num_tokens: 20000
      max_seq_len: 8395
      tensor_parallel_size: 1
      moe_expert_parallel_size: 1
      enable_attention_dp: false
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 32
      disable_overlap_scheduler: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        dtype: fp8
      cache_transceiver_config:
        max_tokens_in_buffer: 8448
        backend: UCX
      num_postprocess_workers: 4

    decode:
      tensor_parallel_size: 4
      moe_expert_parallel_size: 1
      enable_attention_dp: false
      pipeline_parallel_size: 1
      max_batch_size: 1024
      max_num_tokens: 20000
      max_seq_len: 9419
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 1024
      print_iter_log: true
      disable_overlap_scheduler: false
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: fp8
      moe_config:
        backend: TRTLLM
      cache_transceiver_config:
        max_tokens_in_buffer: 8448
        backend: UCX
      stream_interval: 20
      num_postprocess_workers: 4

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "128x512"
  req_rate: "inf"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true
