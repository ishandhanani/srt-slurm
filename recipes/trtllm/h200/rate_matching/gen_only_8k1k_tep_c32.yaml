# GEN-only benchmark for rate-matching validation (TEP c32)
# Target validation: interactivity=38.31, throughput_per_gpu=153.24
# Xianjie target: interactivity=36.1, throughput_per_gpu=144.41 (106.1% match)
# Methodology: Normal disaggregated, filter logs for num_ctx_tokens==0
#
# Rate-matching repo alignment notes:
# - GEN disable_overlap_scheduler: false (not set = default false, matches your config_verified)
# - GEN stream_interval: 20 (from your config_verified "GEN=20")
# - GEN max_num_tokens: 128 (from your config_verified)
# - GEN max_batch_size: 128 (from your verified SOL point)
# - print_iter_log: true (matches rate-matching)
# - moe_config.backend: TRTLLM for TEP (no attention_dp) per rate-matching auto-selection
# - moe_config.use_low_precision_moe_combine: true (matches rate-matching)
name: "gen_only_8k1k_tep_c32_validation"

model:
  path: "dsr1"
  container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post1"
  precision: "fp8"

sbatch_directives:
  cpus-per-gpu: "16"

resources:
  gpu_type: "h200"
  prefill_nodes: 1       # Need prefill for KV cache population
  prefill_workers: 1
  decode_nodes: 1        # TEP mode: single decode node (TP=8)
  decode_workers: 1
  gpus_per_node: 8

backend:
  type: trtllm

  prefill_environment:
    UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"

  decode_environment:
    UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"
    TRTLLM_ENABLE_PDL: "1"                              # TEP mode
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    # GEN-only isolation env vars (from rate-matching methodology):
    TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP: "1"
    TLLM_BENCHMARK_REQ_QUEUES_SIZE: "32"                # Match concurrency

  trtllm_config:
    prefill:
      # Prefill config (for KV cache population)
      backend: pytorch
      trust_remote_code: true
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: false
      enable_chunked_prefill: false
      max_batch_size: 2
      max_num_tokens: 16640
      max_seq_len: 8232
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        dtype: fp8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 32768
      moe_config:
        backend: CUTLASS
      cuda_graph_config: null
      disable_overlap_scheduler: true
      print_iter_log: true
      stream_interval: 1                  # CTX stream_interval=1 (your config_verified)
      num_postprocess_workers: 4
    decode:
      # Decode config for TEP c32 (from your config_verified items)
      backend: pytorch
      trust_remote_code: true
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: false          # TEP mode (not DEP)
      enable_chunked_prefill: false
      max_batch_size: 128                 # From your verified config (allows up to 128 concurrent)
      max_num_tokens: 128                 # GEN max_num_tokens=128 (your config_verified)
      max_seq_len: 9256
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        dtype: fp8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 16384
      moe_config:
        backend: CUTLASS                  # srt-slurm default; rate-matching would use TRTLLM for TEP
        use_low_precision_moe_combine: true
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128]
      # disable_overlap_scheduler: NOT SET (defaults to false, matches your config_verified)
      print_iter_log: true                # CRITICAL: Enable per-iteration logging
      stream_interval: 20                 # GEN stream_interval=20 (your config_verified)
      num_postprocess_workers: 4

benchmark:
  type: "sa-bench"
  isl: 8192              # Target ISL (MUST match for accurate rate-matching)
  osl: 1024              # Target OSL
  concurrencies: "32"    # TEP c32
  req_rate: "inf"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

dynamo:
  install: false

# Validation targets (in comments, not parsed by srt-slurm):
# target_interactivity: 38.31
# target_throughput_per_gpu: 153.24
# xianjie_interactivity: 36.1
# xianjie_throughput_per_gpu: 144.41
# methodology: Filter decode logs for num_ctx_tokens==0, skip first 50 iters, last 10
