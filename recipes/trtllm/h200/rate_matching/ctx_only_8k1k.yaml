# CTX-only benchmark for rate-matching validation
# Based on verified ctx_metrics: req_rate=2.94, target=3.01 (97.7% match)
# Config: isl=8192, osl=1, max_batch_size=2, max_num_tokens=16896, disable_overlap_scheduler=true
#
# Rate-matching repo alignment notes:
# - disable_overlap_scheduler: true (matches config_utils.py build_ctx_config)
# - print_iter_log: true (matches)
# - cuda_graph_config: null (matches)
# - stream_interval: 1 (from your config_verified "CTX=1")
# - moe_config.backend: Using CUTLASS (srt-slurm default), rate-matching uses CUTEDSL
name: "ctx_only_8k1k_validation"

model:
  path: "dsr1"
  container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post1"
  precision: "fp8"

sbatch_directives:
  cpus-per-gpu: "16"

resources:
  gpu_type: "h200"
  prefill_nodes: 1
  prefill_workers: 1
  decode_nodes: 0        # CTX-only: no decode workers
  decode_workers: 0
  gpus_per_node: 8

backend:
  type: trtllm

  prefill_environment:
    UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"

  trtllm_config:
    prefill:
      # CTX-only prefill config (matching rate-matching verified config)
      backend: pytorch
      trust_remote_code: true
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: false          # From verified ctx_config (ctx uses enable_attention_dp: true in SOL yaml, but TEP=false)
      enable_chunked_prefill: false
      max_batch_size: 2                   # From verified ctx_metrics
      max_num_tokens: 16896               # From verified ctx_metrics
      max_seq_len: 8232
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85    # From verified ctx_metrics
        dtype: fp8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 32768
      moe_config:
        backend: CUTLASS                  # srt-slurm uses CUTLASS; rate-matching uses CUTEDSL
      cuda_graph_config: null             # Matches rate-matching
      disable_overlap_scheduler: true     # CRITICAL: From verified ctx_metrics
      print_iter_log: true                # Matches rate-matching
      stream_interval: 1                  # CTX stream_interval=1 from your config_verified
      num_postprocess_workers: 4

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1                # CTX-only: OSL=1 to isolate prefill
  concurrencies: "64"   # High concurrency for saturation (approximating trtllm-bench throughput mode)
  req_rate: "inf"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

dynamo:
  install: false
