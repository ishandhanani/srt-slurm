name: "gb300-agg"

dynamo:
  version: 0.8.1

frontend:  
  nginx_container: nginx

model:
  path: "dpsk-fp4"
  container: "lmsysorg/sglang:v0.5.7-cu130-runtime"
  # container: "lmsysorg/sglang:v0.5.6.post1-cu130-runtime"
  # container: "lmsysorg/sglang:v0.5.6.post2-cu130-runtime"
  precision: "fp4"

resources:
  gpu_type: "gb300"
  agg_nodes: 1
  agg_workers: 1
  gpus_per_node: 4

backend:

  aggregated_environment:
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"

  sglang_config:
    aggregated:
      # Model configuration
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      context-length: 3000

      # Parallelism
      tp-size: 4

      # KV cache and attention
      attention-backend: "trtllm_mla"

      # Radix cache disabled
      disable-radix-cache: true

      # Other flags
      stream-interval: 10
      watchdog-timeout: 1000000

      # Memory and token limits
      mem-fraction-static: 0.82
      max-prefill-tokens: 32768
      chunked-prefill-size: 32768

      # CUDA graphs
      cuda-graph-max-bs: 512

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "48"
  req_rate: "inf"
