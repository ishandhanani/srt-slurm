name: "b200-bf16-1k1k-max-tpt"

model:
  path: "qwen3.5-397B"
  container: "sglang-nightly"
  precision: "bf16"

resources:
  gpu_type: "b200"
  agg_nodes: 1
  agg_workers: 1
  gpus_per_node: 8

backend:
  aggregated_environment:
    NCCL_NVLS_ENABLE: "1"
    SGL_ENABLE_JIT_DEEPGEMM: "false"
    SGLANG_ENABLE_FLASHINFER_GEMM: "true"
    PYTHONUNBUFFERED: "1"

  sglang_config:
    aggregated:
      served-model-name: "Qwen/Qwen3.5-397B-A17B"
      trust-remote-code: true

      tp-size: 8

      disable-radix-cache: true

      mem-fraction-static: 0.82
      chunked-prefill-size: 32768
      max-prefill-tokens: 32768
      cuda-graph-max-bs: 128
      max-running-requests: 128

      stream-interval: 30
      scheduler-recv-interval: 30
      enable-flashinfer-allreduce-fusion: true

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "16x32x64"
  req_rate: "inf"
