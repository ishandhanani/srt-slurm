# Rate-Matching Sweep: DSR1 1k/1k MTP-only on H200 (TP=8)
#
# Each job runs MULTIPLE concurrencies in a single sa-bench invocation.
#
# TP=8 MTP configs:
#   MTP3 TEP: batch=128, max_tokens=512, gpu_mem=0.9, conc=[1..128]
#   MTP3 DEP: batch=256, max_tokens=1024, gpu_mem=0.7, conc=[64..1024]
#   MTP2 DEP: batch=256, max_tokens=1024, gpu_mem=0.7, conc=[256..1024]
#   MTP1 DEP: batch=512, max_tokens=1024, gpu_mem=0.7, conc=[512..4096]
#
# NOTE: TP=16/32 configs require multi-node decode workers (2 or 4 nodes per
# worker), which srt-slurm doesn't currently support. Only TP=8 is included.
#
# Estimated jobs: 1 CTX + 20 GEN + ~20 E2E = ~41 total
#
# Usage:
#   srtctl-rate-match dry-run -f tools/rate_matching/h200_1k1k_mtp_sweep.yaml
#   srtctl-rate-match run -f tools/rate_matching/h200_1k1k_mtp_sweep.yaml

name: dsr1_1k1k_mtp

model:
  path: dsr1
  container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post1"
  precision: fp8

workload:
  isl: 1024
  osl: 1024
  random_ratio: 0.8  # avg_random_ratio = (0.8 + 1) / 2 = 0.9
  # MTP accept rates: effective tokens per decode step per user.
  # These are model- and ISL-dependent. Values below are for DSR1 at 1k ISL.
  mtp_accept_rates:
    1: 1.8
    2: 2.28
    3: 2.56

resources:
  gpu_type: h200
  gpus_per_node: 8
  ctx_gpus_per_instance: 8
  gen_gpus_per_instance: 8
  max_total_gpus: 64

ctx_config:
  benchmark_concurrency: 64

# -----------------------------------------------------------------------
# GEN sweep groups
#
# Each item runs multiple concurrencies in a single sa-bench job.
# sa-bench sweeps through the concurrency list sequentially.
# -----------------------------------------------------------------------
gen_sweep:
  # --- MTP-3, TEP, batch=128, max_tokens=512, gpu_mem=0.9 ---
  mtp3_tep:
    expansion: zip
    parameters:
      concurrency: [[1, 2, 4, 8, 16, 32, 64, 128]]
      batch_size:  [128]
      max_num_tokens: [512]
      gpu_memory_fraction: [0.9]
    defaults:
      mode: tep
      tp_size: 8
      mtp_num: 3

  # --- MTP-3, DEP, batch=256, max_tokens=1024, gpu_mem=0.7 ---
  mtp3_dep:
    expansion: zip
    parameters:
      concurrency: [[64, 128, 256, 512, 1024]]
      batch_size:  [256]
      max_num_tokens: [1024]
      gpu_memory_fraction: [0.7]
    defaults:
      mode: dep
      tp_size: 8
      mtp_num: 3

  # --- MTP-2, DEP, batch=256, max_tokens=1024, gpu_mem=0.7 ---
  mtp2_dep:
    expansion: zip
    parameters:
      concurrency: [[256, 512, 1024]]
      batch_size:  [256]
      max_num_tokens: [1024]
      gpu_memory_fraction: [0.7]
    defaults:
      mode: dep
      tp_size: 8
      mtp_num: 2

  # --- MTP-1, DEP, batch=512, max_tokens=1024, gpu_mem=0.7 ---
  mtp1_dep:
    expansion: zip
    parameters:
      concurrency: [[512, 1024, 2048, 4096]]
      batch_size:  [512]
      max_num_tokens: [1024]
      gpu_memory_fraction: [0.7]
    defaults:
      mode: dep
      tp_size: 8
      mtp_num: 1

settings:
  poll_interval: 180
  max_retries: 2
  run_e2e_validation: true
  parallel_submissions: true

  e2e_validation:
    concurrency_multipliers: [1.0, 1.05]
    tpot_tolerance_pct: 15.0
    throughput_tolerance_pct: 20.0
    ttft_constraint_ms: 5000.0
