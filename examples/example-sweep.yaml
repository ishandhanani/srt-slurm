# Prefill parallelism sweep on GB200 NVL72 with DeepSeek-R1 FP4
#
# Sweeps prefill_nodes to explore prefill scaling on a disaggregated Dynamo setup.
# Each prefill worker gets 1 node (4 GPUs, TP=4). Increasing prefill_nodes adds
# more DP-parallel prefill replicas while decode stays fixed at 2 nodes.
#
# This generates 3 jobs:
#   1. 1 prefill node  (TP=4, DP=1) + 2 decode nodes  -> 3 nodes total
#   2. 2 prefill nodes (TP=4, DP=2) + 2 decode nodes  -> 4 nodes total
#   3. 4 prefill nodes (TP=4, DP=4) + 2 decode nodes  -> 6 nodes total
#
# Usage:
#   srtctl dry-run -f examples/example-sweep.yaml   # Preview (sweep auto-detected)
#   srtctl apply -f examples/example-sweep.yaml      # Submit all jobs

name: "dsr1-fp4-prefill-scaling"

sweep:
  prefill_nodes: [1, 2, 4]

dynamo:
  version: 0.8.1

frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 3
  nginx_container: nginx

model:
  path: "dsfp4"
  container: "lmsysorg/sglang:v0.5.8-cu130"
  precision: "fp4"

resources:
  gpu_type: "gb200"
  prefill_nodes: "{prefill_nodes}"
  prefill_workers: "{prefill_nodes}"
  decode_nodes: 2
  decode_workers: 2
  gpus_per_node: 4

backend:
  prefill_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
    PYTHONUNBUFFERED: "1"
    DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_DECODE_BOOTSTRAP_TIMEOUT: "1000"
    MC_FORCE_MNNVL: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_ENABLE_JIT_DEEPGEMM: "false"

  decode_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
    PYTHONUNBUFFERED: "1"
    DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_DECODE_BOOTSTRAP_TIMEOUT: "1000"
    MC_FORCE_MNNVL: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_ENABLE_JIT_DEEPGEMM: "false"

  sglang_config:
    prefill:
      disaggregation-mode: "prefill"
      served-model-name: "deepseek-ai/DeepSeek-R1"
      trust-remote-code: true
      disable-radix-cache: true
      kv-cache-dtype: "fp8_e4m3"
      attention-backend: "trtllm_mla"
      quantization: "modelopt_fp4"
      moe-runner-backend: "flashinfer_trtllm"
      stream-interval: 10
      watchdog-timeout: 1000000
      context-length: 2200
      mem-fraction-static: 0.95
      max-total-tokens: 8192
      chunked-prefill-size: 8192
      cuda-graph-max-bs: 256
      max-running-requests: 512
      scheduler-recv-interval: 10
      enable-symm-mem: true
      load-balance-method: "round_robin"
      disaggregation-bootstrap-port: 30001
      disaggregation-transfer-backend: nixl
      fp4-gemm-backend: "flashinfer_trtllm"
      data-parallel-size: 1
      tensor-parallel-size: 4
      expert-parallel-size: 1

    decode:
      disaggregation-mode: "decode"
      served-model-name: "deepseek-ai/DeepSeek-R1"
      prefill-round-robin-balance: true
      trust-remote-code: true
      disable-radix-cache: true
      kv-cache-dtype: "fp8_e4m3"
      attention-backend: "trtllm_mla"
      quantization: "modelopt_fp4"
      moe-runner-backend: "flashinfer_trtllm"
      disaggregation-bootstrap-port: 30001
      stream-interval: 10
      watchdog-timeout: 1000000
      context-length: 2200
      mem-fraction-static: 0.95
      chunked-prefill-size: 8192
      cuda-graph-max-bs: 256
      scheduler-recv-interval: 10
      enable-symm-mem: true
      disaggregation-transfer-backend: nixl
      fp4-gemm-backend: "flashinfer_trtllm"
      tensor-parallel-size: 4
      expert-parallel-size: 1

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "4x8x32"
  req_rate: "inf"
